<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vellum — The Living Surface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@300&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #efe5cf }
  #S { width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch }
  #S::-webkit-scrollbar { width: 0 }
  canvas { display: block; margin: 0 auto }
  .u {
    position: fixed; z-index: 10; letter-spacing: .06em;
    font: 300 9px/1 'IBM Plex Mono', monospace; color: #b5a68e; opacity: .45;
    transition: opacity .6s; user-select: none;
  }
  #tr { bottom: 14px; right: 20px; user-select: all }
  #tr:hover { opacity: 1; color: #7a6b52 }
  #sn { bottom: 14px; left: 20px; cursor: pointer }
  #sn:hover { opacity: .8 }
  #md { top: 14px; right: 20px; cursor: pointer; opacity: .35; font-size: 9px; transition: opacity .4s }
  #md:hover { opacity: .8 }
  #md .hint { font-size: 7px; opacity: .5; margin-left: 4px }
  #ct { top: 14px; left: 20px; font-size: 7px; opacity: .2; display: none }
  #hints { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); z-index: 10;
    font: 300 10px/1.6 'IBM Plex Mono', monospace; color: #b5a68e; opacity: 0;
    text-align: center; pointer-events: none; transition: opacity 2s ease }
  #hints.show { opacity: .35 }
  #vl { position: fixed; inset: 0; background: #efe5cf; z-index: 100; opacity: 1; transition: opacity 2.8s ease; pointer-events: none }
  #vl.o { opacity: 0 }
</style>
</head>
<body>
<div id="vl"></div>
<div id="S"><canvas id="c"></canvas></div>
<div class="u" id="tr"></div>
<div class="u" id="sn">sound</div>
<div class="u" id="md" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab'}))">palimpsest<span class="hint">Tab</span></div>
<div class="u" id="ct"></div>
<div id="hints"></div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
