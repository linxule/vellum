name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          (cd app && bun install --frozen-lockfile)
          (cd worker && bun install --frozen-lockfile)
      - name: Audit active dependencies
        run: |
          bun audit
          # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, <=4.0.7): no patched release exists
          # (4.0.7 is latest; vite/tinyglobby/vite-plugin-singlefile are on their newest).
          # Build-time glob matching only; not in the shipped bundle, no untrusted input.
          # Remove this ignore once picomatch publishes a fix.
          (cd app && bun audit --ignore=GHSA-fc5q-39xc-vjpf)
          (cd worker && bun audit)
      - run: bun run verify
