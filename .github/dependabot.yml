version: 2
# Generate Bun v1 locks with Bun 1.3.14; the updater cannot yet read v2 locks.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
    # Pretext 1.x is a breaking major for the renderer, not a routine bump:
    # see README, "Pretext 1.0.0 is held". Remove once that migration is done.
    ignore:
      - dependency-name: "@chenglou/pretext"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "bun"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
    # Pretext 1.x is a breaking major for the renderer, not a routine bump:
    # see README, "Pretext 1.0.0 is held". Remove once that migration is done.
    ignore:
      - dependency-name: "@chenglou/pretext"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "bun"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
