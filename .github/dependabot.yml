version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "bun"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "bun"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
