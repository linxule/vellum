<!DOCTYPE html>
<html lang="en" class="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('night')</script>
<title>Vellum — Pensieve</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Noto+Serif+Thai:wght@300;400;500&family=IBM+Plex+Mono:wght@300&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper, #f2ead9) }
  canvas { display: block; position: fixed; top: 0; left: 0; cursor: none }
  .u {
    position: fixed; z-index: 10; letter-spacing: .06em;
    font: 300 9px/1 'IBM Plex Mono', monospace; color: #5b5346; opacity: .6;
    transition: opacity .6s; user-select: none; cursor: default;
  }
  #tr { bottom: 14px; right: 20px; user-select: all }
  #tr:hover { opacity: 1; color: #2f2a22 }
  #vl { position: fixed; inset: 0; background: var(--paper, #f2ead9); z-index: 100; opacity: 1; transition: opacity 2.8s ease; pointer-events: none }
  #vl.o { opacity: 0 }
  #sz { display: block; width: 100%; height: 320px; pointer-events: none }
  #fs { top: 14px; right: 20px; background: none; border: none; padding: 4px 6px; cursor: pointer; font: 300 13px/1 'IBM Plex Mono', monospace }
  #fs:hover { opacity: 1; color: #2f2a22 }
  /* Paper look: an ink wash under the text, the text multiplied over it, a speckle on top. */
  #w { width: 100%; height: 100%; z-index: 0 }
  #c { z-index: 1; mix-blend-mode: multiply }
  #g { position: fixed; inset: 0; z-index: 2; pointer-events: none; background-size: 128px 128px }
  html.paper.night { --paper: #1a1f3a }
  html.paper.night #c { mix-blend-mode: screen }
  html.paper.night .u { color: #a4a9cf; opacity: .6 }
  html.paper.night #tr:hover, html.paper.night #fs:hover { color: #e4e6f6 }
</style>
</head>
<body>
<div id="vl"></div>
<canvas id="w" aria-hidden="true"></canvas>
<canvas id="c"></canvas>
<div id="g" aria-hidden="true"></div>
<button id="fs" class="u" type="button" hidden aria-label="Toggle display mode" title="Toggle fullscreen">⛶</button>
<div class="u" id="tr"></div>
<div id="sz" aria-hidden="true"></div>
<script type="module" src="./src/mcp-app.ts"></script>
</body>
</html>
